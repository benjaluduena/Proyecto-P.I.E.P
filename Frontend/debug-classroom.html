<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Classroom - P.I.E.P.</title>
    <script src="lib/supabase.js"></script>
    <script src="/JS/supabase-init.js"></script>
</head>
<body>
    <h1>Debug Classroom Functionality</h1>
    <div id="debug-info"></div>
    <button id="test-classroom-btn">Probar Función Classroom</button>
    <button id="check-auth-btn">Verificar Autenticación</button>
    <button id="check-profile-btn">Verificar Perfil</button>

    <script>
        const debugInfo = document.getElementById('debug-info');
        
        function log(message) {
            console.log(message);
            debugInfo.innerHTML += `<p>${message}</p>`;
        }

        // Función para verificar autenticación
        document.getElementById('check-auth-btn').addEventListener('click', async () => {
            debugInfo.innerHTML = '';
            log('=== VERIFICANDO AUTENTICACIÓN ===');
            
            try {
                // Verificar localStorage primero
                const storedSession = localStorage.getItem('supabase.auth.token');
                log(`Token en localStorage: ${storedSession ? 'SÍ' : 'NO'}`);
                
                if (storedSession) {
                    try {
                        const sessionData = JSON.parse(storedSession);
                        log(`Access token presente: ${sessionData.access_token ? 'SÍ' : 'NO'}`);
                        if (sessionData.user) {
                            log(`Usuario en sesión: ${sessionData.user.email}`);
                        }
                    } catch (e) {
                        log('❌ Error parseando sesión almacenada');
                    }
                }
                
                if (typeof window.waitForSupabase === 'function') {
                    log('Esperando inicialización de Supabase...');
                    const supabaseClient = await window.waitForSupabase();
                    log('✅ Supabase inicializado correctamente');
                    
                    const { data: { user }, error } = await supabaseClient.auth.getUser();
                    if (error) {
                        log(`❌ Error obteniendo usuario: ${error.message}`);
                        return;
                    }
                    
                    if (user) {
                        log(`✅ Usuario autenticado: ${user.email}`);
                        log(`ID: ${user.id}`);
                    } else {
                        log('❌ No hay usuario autenticado');
                    }
                } else {
                    log('❌ waitForSupabase no está disponible');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`);
            }
        });

        // Función para verificar perfil
        document.getElementById('check-profile-btn').addEventListener('click', async () => {
            debugInfo.innerHTML = '';
            log('=== VERIFICANDO PERFIL ===');
            
            try {
                const supabaseClient = await window.waitForSupabase();
                const { data: { user } } = await supabaseClient.auth.getUser();
                
                if (!user) {
                    log('❌ No hay usuario autenticado');
                    return;
                }
                
                log(`Buscando perfil para usuario: ${user.id}`);
                
                const { data: profile, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', user.id)
                    .single();
                
                if (error) {
                    log(`❌ Error obteniendo perfil: ${error.message}`);
                    return;
                }
                
                if (profile) {
                    log(`✅ Perfil encontrado:`);
                    log(`- Rol: ${profile.role || 'NO DEFINIDO'}`);
                    log(`- Nombre: ${profile.full_name || 'NO DEFINIDO'}`);
                    log(`- Email: ${profile.email || 'NO DEFINIDO'}`);
                } else {
                    log('❌ No se encontró perfil para el usuario');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`);
            }
        });

        // Función para probar classroom
        document.getElementById('test-classroom-btn').addEventListener('click', async () => {
            debugInfo.innerHTML = '';
            log('=== PROBANDO FUNCIÓN CLASSROOM ===');
            
            try {
                let supabaseClient;
                if (typeof window.waitForSupabase === 'function') {
                    log('Esperando inicialización de Supabase...');
                    supabaseClient = await window.waitForSupabase();
                } else if (typeof supabase !== 'undefined') {
                    supabaseClient = supabase;
                } else {
                    log('❌ Supabase no está disponible');
                    return;
                }
                
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) {
                    log('❌ No hay usuario autenticado, debería redirigir a login');
                    return;
                }

                log(`✅ Usuario autenticado: ${user.email}`);

                // Verificar el rol del usuario
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('role')
                    .eq('id', user.id)
                    .single();

                log(`Perfil obtenido: ${JSON.stringify(profile)}`);

                if (profile && profile.role === 'docente') {
                    log('✅ Rol: docente - debería redirigir a /classroom-teacher.html');
                } else if (profile && profile.role === 'estudiante') {
                    log('✅ Rol: estudiante - debería redirigir a /classroom-student.html');
                } else {
                    log(`❌ Rol no válido: ${profile?.role || 'undefined'}`);
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`);
            }
        });
    </script>
</body>
</html>
