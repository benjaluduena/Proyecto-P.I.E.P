<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Assets/Imagenes/PIEP-LOGOS.png">
  <link rel="shortcut icon" type="image/png" href="/Assets/Imagenes/PIEP-LOGOS.png">
  <link rel="apple-touch-icon" href="/Assets/Imagenes/PIEP-LOGOS.png">
  <title>Mapa Mental - P.I.E.P.</title>
  <link rel="stylesheet" href="/Css/mapa-mental-modern.css" />
  <link rel="stylesheet" href="/Css/Clases/clases.css">
  <script src="/lib/supabase.js"></script>
  <script src="/JS/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.3/dist/browser/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.3/dist/browser/index.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>

<body>
  <!-- Main Content -->
  <div class="mm-main-content">
    <div class="mm-top-header">
      <div class="mm-top-header-left">
        <button class="btn-white-icon" id="homeBtn" aria-label="Cerrar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M1.99805 21.0001V19.0001L3.99805 18.9999V4.83465C3.99805 4.35136 4.34367 3.93723 4.81916 3.85078L14.2907 2.12868C14.6167 2.0694 14.9291 2.28564 14.9884 2.61167C14.9948 2.64708 14.998 2.68301 14.998 2.719V3.9999L18.998 4.00007C19.5503 4.00007 19.998 4.44779 19.998 5.00007V18.9999L21.998 19.0001V21.0001H17.998V6.00007L14.998 5.9999V21.0001H1.99805ZM12.998 4.3965L5.99805 5.66923V19.0001H12.998V4.3965ZM11.998 11.0001V13.0001H9.99805V11.0001H11.998Z">
            </path>
          </svg>
        </button>
        <div class="mm-top-title" id="fileName">
          Cargando documento...
        </div>
      </div>
      <div class="mm-top-header-right">
        <button id="downloadBtn" class="btn-white">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M13 10H18L12 16L6 10H11V3H13V10ZM4 19H20V12H22V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V12H4V19Z">
            </path>
          </svg>
          Descargar
        </button>
        <button id="exportBtn" class="btn-purple">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M2.9918 21C2.44405 21 2 20.5551 2 20.0066V3.9934C2 3.44476 2.45531 3 2.9918 3H21.0082C21.556 3 22 3.44495 22 3.9934V20.0066C22 20.5552 21.5447 21 21.0082 21H2.9918ZM20 15V5H4V19L14 9L20 15ZM20 17.8284L14 11.8284L6.82843 19H20V17.8284ZM8 11C6.89543 11 6 10.1046 6 9C6 7.89543 6.89543 7 8 7C9.10457 7 10 7.89543 10 9C10 10.1046 9.10457 11 8 11Z">
            </path>
          </svg>
          Exportar
        </button>
      </div>
    </div>
    <!-- Document Info -->
    <div class="mm-document-info" style="display: none;">
      <div class="mm-document-header">
        <div class="mm-document-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
            <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.89 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z" />
          </svg>
        </div>
        <div class="mm-document-details">
          <h3 class="mm-document-name" id="fileName">Cargando documento...</h3>
          <div class="mm-document-meta">
            <span class="mm-meta-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
              </svg>
              Mapa Mental Interactivo
            </span>
            <span class="mm-meta-item" id="fileTime">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0012 4c-4.97 0-9 4.03-9 9s4.02 9 9 9a8.994 8.994 0 007.03-14.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z" />
              </svg>
              Generado ahora
            </span>
          </div>
        </div>
        <div class="mm-status-indicator" id="statusIndicator">
          <div class="mm-status-dot"></div>
          <span>Procesando...</span>
        </div>
      </div>
      <div class="mm-progress-container" id="progressContainer">
        <div class="mm-progress-bar" id="progressBar">
          <div class="mm-progress-fill" id="progressFill"></div>
        </div>
        <span class="mm-progress-text" id="progressText">Generando mapa mental...</span>
      </div>
    </div>

    <!-- Mind Map Container -->
    <div class="mm-container">
      <div class="mm-header">
        <!-- <div class="mm-header-left">
          <div class="mm-title-section">
            <div class="mm-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
              </svg>
            </div>
            <div>
              <h1 class="mm-title">Mapa Mental Interactivo</h1>
              <p class="mm-subtitle">Navegación visual del contenido</p>
            </div>
          </div>
        </div> -->
        <div class="mm-header-right"></div>
      </div>

      <!-- Loading State -->
      <div class="mm-loading-state" id="mmLoadingState">
        <div class="mm-loading-animation">
          <div class="mm-brain-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
            </svg>
          </div>
          <div class="mm-loading-text">
            <h3>Creando Mapa Mental</h3>
            <p>Organizando conceptos y relaciones...</p>
          </div>
        </div>
      </div>

      <!-- Markmap Visualization -->
      <div class="mm-visualization" id="markmapWrapper" style="display: none;">
        <svg id="markmap"></svg>
      </div>

      <!-- Controls -->
      <div class="mm-controls">
        <button class="mm-control-btn" id="zoomInBtn" title="Acercar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748ZM10 10V7H12V10H15V12H12V15H10V12H7V10H10Z"></path></svg>
        </button>
        <button class="mm-control-btn" id="zoomOutBtn" title="Alejar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748ZM7 10H15V12H7V10Z"></path></svg>
        </button>
        <button class="mm-control-btn" id="resetBtn" title="Centrar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M11 4V2H13V4H19C19.5523 4 20 4.44772 20 5V10C20 10.5523 19.5523 11 19 11H13V13H17C17.5523 13 18 13.4477 18 14V19C18 19.5523 17.5523 20 17 20H13V22H11V20H7C6.44772 20 6 19.5523 6 19V14C6 13.4477 6.44772 13 7 13H11V11H5C4.44772 11 4 10.5523 4 10V5C4 4.44772 4.44772 4 5 4H11ZM8 15V18H16V15H8ZM6 9H18V6H6V9Z"></path></svg>
        </button>
        <button class="mm-control-btn" id="fullscreenBtn" title="Pantalla completa">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 3V5H4V9H2V3H8ZM2 21V15H4V19H8V21H2ZM22 21H16V19H20V15H22V21ZM22 9H20V5H16V3H22V9Z"></path></svg>
        </button>
      </div>

      <!-- Actions -->
      <div class="mm-actions" id="mmActions" style="display: none;">
        <button class="mm-btn mm-btn-primary" id="">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z" />
          </svg>
          Descargar Markdown
        </button>
        <button class="mm-btn mm-btn-secondary" id="copyBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
          </svg>
          Copiar al Portapapeles
        </button>
        <button class="mm-btn mm-btn-secondary" id="">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z" />
          </svg>
          Exportar Imagen
        </button>
        <button class="mm-btn mm-btn-accent" id="">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
          </svg>
          Volver al Inicio
        </button>
      </div>
    </div>
  </div>

  <script src="/JS/mapa-mental.js"></script>
</body>

</html>
