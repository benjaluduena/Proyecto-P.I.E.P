<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen - Study AI</title>
    <link rel="stylesheet" href="/Css/resumen-modern.css">
</head>

<body>
    <!-- Top Header -->
    <div class="top-header">
        <div class="header-content">
            <div class="logo">
                Study<span class="ai-badge">AI</span>
            </div>
            <button class="back-btn">
                ← Volver al inicio
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- File Information -->
        <div class="file-info-modern">
            <div class="file-header">
                <div class="file-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.89 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/>
                    </svg>
                </div>
                <div class="file-details-modern">
                    <h3 class="file-name-modern" id="fileName">Cargando...</h3>
                    <div class="file-meta">
                        <span class="meta-item" id="filePages">📊 Procesando...</span>
                        <span class="meta-item" id="fileTime">⏱️ Generando resumen...</span>
                        <span class="meta-item status-processing" id="statusIndicator">🔄 En progreso</span>
                    </div>
                </div>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-modern" id="progressBar">
                    <div class="progress-fill-modern" id="progressFill"></div>
                </div>
                <span class="progress-text" id="progressText">Cargando resumen...</span>
            </div>
        </div>

        <!-- Summary Container -->
        <div class="summary-container-modern">
            <div class="summary-header-modern">
                <div class="summary-icon-modern">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 17H4v2h10v-2zm6-8H4v2h16V9zM4 15h16v-2H4v2zM4 5v2h16V5H4z"/>
                    </svg>
                </div>
                <div class="summary-title-section">
                    <h1 class="summary-title-modern">Resumen Inteligente</h1>
                    <p class="summary-subtitle">Generado automáticamente con IA</p>
                </div>
                <div class="summary-stats" id="summaryStats">
                    <div class="stat-item">
                        <span class="stat-number" id="wordCount">0</span>
                        <span class="stat-label">palabras</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" id="readingTime">0</span>
                        <span class="stat-label">min lectura</span>
                    </div>
                </div>
            </div>

            <div class="summary-content-modern" id="summaryContent">
                <div class="loading-state">
                    <div class="loading-animation">
                        <div class="loading-dots">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                    </div>
                    <h3>Analizando tu documento</h3>
                    <p>Nuestra IA está procesando el contenido para generar un resumen inteligente...</p>
                </div>
            </div>

            <div class="actions-modern" id="actionsContainer" style="display: none;">
                <button class="btn-modern btn-primary-modern" id="generateQuestionsBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    Generar Preguntas
                </button>
                <button class="btn-modern btn-secondary-modern" id="downloadBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/>
                    </svg>
                    Descargar
                </button>
                <button class="btn-modern btn-secondary-modern" id="shareBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.50-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
                    </svg>
                    Compartir
                </button>
            </div>
        </div>
    </div>

    <script src="/lib/supabase.js"></script>
    <script src="/JS/config.js"></script>
    <script src="/JS/resumen.js"></script>
</body>

</html>
