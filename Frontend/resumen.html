<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen - Study AI</title>
    <link rel="stylesheet" href="/Css/resumen.css">
</head>

<body>
    <!-- Top Header -->
    <div class="top-header">
        <div class="header-content">
            <div class="logo">
                Study<span class="ai-badge">AI</span>
            </div>
            <button class="back-btn">
                ← Volver al inicio
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- File Information -->
        <div class="file-info">
            <div class="file-name" id="fileName">Cargando...</div>
            <div class="file-details">
                <span>📄 Documento PDF</span>
                <span id="filePages">📊 Procesando...</span>
                <span id="fileTime">⏱️ Generando resumen...</span>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <small style="color: #666;" id="progressText">Cargando resumen...</small>
        </div>

        <!-- Summary Container -->
        <div class="summary-container">
            <div class="summary-header">
                <div class="summary-icon">
                    <span style="color: white; font-size: 20px;">📋</span>
                </div>
                <h1 class="summary-title">Resumen Inteligente</h1>
            </div>

            <div class="summary-content" id="summaryContent">
                <!-- El contenido se cargará dinámicamente -->
                <div class="loading-message">
                    <div class="loading-spinner"></div>
                    <p>Generando resumen inteligente...</p>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="generateQuestionsBtn">Generar Preguntas</button>
                <button class="btn btn-secondary" id="downloadBtn">Descargar Resumen</button>
                <button class="btn btn-secondary" id="shareBtn">Compartir</button>
            </div>
        </div>
    </div>

    <script src="/lib/supabase.js"></script>
    <script src="/JS/config.js"></script>
    <script src="/JS/resumen.js"></script>
</body>

</html>
