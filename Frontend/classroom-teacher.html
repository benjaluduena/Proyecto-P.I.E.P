<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Classrooms - P.I.E.P.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Css/styles.css">
    <style>
        .classroom-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .classrooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .classroom-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid #e1e5e9;
        }

        .classroom-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .classroom-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .classroom-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0;
        }

        .classroom-status {
            background: #e8f5e8;
            color: #2d5a2d;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .classroom-info {
            margin-bottom: 16px;
        }

        .classroom-subject {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .classroom-description {
            color: #444;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .classroom-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .classroom-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 1px solid #dee2e6;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .join-code {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
        }

        .close:hover {
            color: #000;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            margin-bottom: 16px;
            color: #333;
        }

        .empty-state p {
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="classroom-container">
        <div class="header-section">
            <div>
                <h1>Mis Classrooms</h1>
                <p>Gestiona tus clases y comparte materiales con tus estudiantes</p>
            </div>
            <button class="btn-primary" onclick="openCreateClassroomModal()">
                + Crear Classroom
            </button>
        </div>

        <div id="classroomsContent">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando classrooms...</p>
            </div>
        </div>
    </div>

    <!-- Modal para crear classroom -->
    <div id="createClassroomModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCreateClassroomModal()">&times;</span>
            <h2>Crear Nuevo Classroom</h2>
            <form id="createClassroomForm">
                <div class="form-group">
                    <label class="form-label" for="classroomName">Nombre del Classroom *</label>
                    <input type="text" id="classroomName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="classroomSubject">Materia</label>
                    <input type="text" id="classroomSubject" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label" for="classroomGrade">Nivel Educativo</label>
                    <select id="classroomGrade" class="form-input">
                        <option value="">Seleccionar nivel</option>
                        <option value="secundario">Secundario</option>
                        <option value="terciario">Terciario</option>
                        <option value="universitario">Universitario</option>
                        <option value="posgrado">Posgrado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="classroomDescription">Descripción</label>
                    <textarea id="classroomDescription" class="form-input form-textarea"></textarea>
                </div>
                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" class="btn-secondary" onclick="closeCreateClassroomModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Crear Classroom</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/lib/supabase.js"></script>
    <script src="/JS/config.js"></script>
    <script src="/JS/auth-check.js"></script>
    <script>
        // Verificar autenticación y rol de docente
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    window.location.href = '/login.html';
                    return;
                }

                // Verificar que es docente
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', user.id)
                    .single();

                if (!profile || profile.role !== 'docente') {
                    alert('Acceso denegado. Solo docentes pueden acceder a esta página.');
                    window.location.href = '/index.html';
                    return;
                }

                loadClassrooms();
            } catch (error) {
                console.error('Error verificando autenticación:', error);
                window.location.href = '/login.html';
            }
        });

        async function loadClassrooms() {
            try {
                // Obtener token de la sesión
                const session = localStorage.getItem('session');
                const sessionData = session ? JSON.parse(session) : null;
                const accessToken = sessionData ? sessionData.access_token : null;
                
                if (!accessToken) {
                    throw new Error('No hay token de acceso');
                }
                
                const response = await fetch('/api/classroom/teacher/classrooms', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Error cargando classrooms');
                }

                const data = await response.json();
                displayClassrooms(data.classrooms);
            } catch (error) {
                console.error('Error cargando classrooms:', error);
                document.getElementById('classroomsContent').innerHTML = `
                    <div class="empty-state">
                        <h3>Error al cargar classrooms</h3>
                        <p>No se pudieron cargar tus classrooms. Intenta recargar la página.</p>
                    </div>
                `;
            }
        }

        function displayClassrooms(classrooms) {
            const container = document.getElementById('classroomsContent');
            
            if (!classrooms || classrooms.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No tienes classrooms aún</h3>
                        <p>Crea tu primer classroom para empezar a compartir materiales con tus estudiantes.</p>
                        <button class="btn-primary" onclick="openCreateClassroomModal()">
                            Crear mi primer Classroom
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="classrooms-grid">
                    ${classrooms.map(classroom => `
                        <div class="classroom-card">
                            <div class="classroom-header">
                                <h3 class="classroom-title">${classroom.name}</h3>
                                <span class="classroom-status">${classroom.is_active ? 'Activo' : 'Inactivo'}</span>
                            </div>
                            <div class="classroom-info">
                                ${classroom.subject ? `<div class="classroom-subject">📚 ${classroom.subject}</div>` : ''}
                                ${classroom.description ? `<div class="classroom-description">${classroom.description}</div>` : ''}
                            </div>
                            <div class="classroom-stats">
                                <div class="stat-item">
                                    <div class="stat-number">${classroom.classroom_enrollments[0]?.count || 0}</div>
                                    <div class="stat-label">Estudiantes</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-number">${classroom.classroom_materials[0]?.count || 0}</div>
                                    <div class="stat-label">Materiales</div>
                                </div>
                            </div>
                            <div style="margin-bottom: 16px;">
                                <label style="font-size: 0.875rem; color: #666; margin-bottom: 4px; display: block;">Código de unión:</label>
                                <div class="join-code">${classroom.join_code}</div>
                            </div>
                            <div class="classroom-actions">
                                <button class="btn-secondary" onclick="viewClassroom(${classroom.id})">Ver detalles</button>
                                <button class="btn-secondary" onclick="manageMaterials(${classroom.id})">Materiales</button>
                                <button class="btn-secondary" onclick="viewStudents(${classroom.id})">Estudiantes</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

                function openCreateClassroomModal() {
          document.getElementById('createClassroomModal').style.display = 'block';
        }

        function closeCreateClassroomModal() {
          document.getElementById('createClassroomModal').style.display = 'none';
          document.getElementById('createClassroomForm').reset();
        }
        
        // Event listener para el botón de abrir modal
        const createButton = document.querySelector('.btn-primary');
        if (createButton && createButton.textContent.includes('Crear')) {
          createButton.addEventListener('click', function() {
            openCreateClassroomModal();
          });
        }

                // Event listener para el formulario de crear classroom
        const createForm = document.getElementById('createClassroomForm');
        if (createForm) {
          createForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
              name: document.getElementById('classroomName').value,
              subject: document.getElementById('classroomSubject').value,
              grade_level: document.getElementById('classroomGrade').value,
              description: document.getElementById('classroomDescription').value
            };

            try {
              console.log('Enviando datos:', formData);
              
              // Obtener token de la sesión
              const session = localStorage.getItem('session');
              const sessionData = session ? JSON.parse(session) : null;
              const accessToken = sessionData ? sessionData.access_token : null;
              
              console.log('Token:', accessToken);
              
              if (!accessToken) {
                throw new Error('No hay token de acceso. Por favor, inicia sesión nuevamente.');
              }
              
              const response = await fetch('/api/classroom/create', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${accessToken}`
                },
                body: JSON.stringify(formData)
              });

              console.log('Respuesta del servidor:', response.status, response.statusText);

              if (!response.ok) {
                const errorData = await response.text();
                console.error('Error del servidor:', errorData);
                throw new Error(`Error ${response.status}: ${errorData}`);
              }

              const result = await response.json();
              console.log('Resultado exitoso:', result);
              closeCreateClassroomModal();
              loadClassrooms();
              alert('Classroom creado exitosamente');
            } catch (error) {
              console.error('Error creando classroom:', error);
              alert(`Error creando classroom: ${error.message}`);
            }
          });
        }

        function viewClassroom(classroomId) {
            // Implementar vista detallada del classroom
            alert('Funcionalidad en desarrollo');
        }

        function manageMaterials(classroomId) {
            // Implementar gestión de materiales
            alert('Funcionalidad en desarrollo');
        }

        function viewStudents(classroomId) {
            // Implementar vista de estudiantes
            alert('Funcionalidad en desarrollo');
        }

                // Event listeners para cerrar modales
        const createModal = document.getElementById('createClassroomModal');
        const closeBtn = document.querySelector('.close');
        const cancelBtn = document.querySelector('.btn-secondary');
        
        if (createModal) {
          createModal.addEventListener('click', function(event) {
            if (event.target === createModal) {
              closeCreateClassroomModal();
            }
          });
        }
        
        if (closeBtn) {
          closeBtn.addEventListener('click', function() {
            closeCreateClassroomModal();
          });
        }
        
        if (cancelBtn) {
          cancelBtn.addEventListener('click', function() {
            closeCreateClassroomModal();
          });
        }
    </script>
</body>
</html>
