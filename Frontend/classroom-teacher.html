<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Classrooms - P.I.E.P.</title>
    <link rel="icon" type="image/png" href="/Assets/Imagenes/PIEP-LOGOS.png">
    <link rel="shortcut icon" type="image/png" href="/Assets/Imagenes/PIEP-LOGOS.png">
    <link rel="apple-touch-icon" href="/Assets/Imagenes/PIEP-LOGOS.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Css/styles.css">
    <link rel="stylesheet" href="/Css/Clases/clases.css">
    <link rel="stylesheet" href="/Css/Clasroom/clasroom-teacher.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-logo">
                    <img src="/Assets/Imagenes/PIEP-LOGOS.png" alt="">
                    <button type="button" class="btn-sidebar-menu-icon" id="btnhome">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M1.99805 21.0001V19.0001L3.99805 18.9999V4.83465C3.99805 4.35136 4.34367 3.93723 4.81916 3.85078L14.2907 2.12868C14.6167 2.0694 14.9291 2.28564 14.9884 2.61167C14.9948 2.64708 14.998 2.68301 14.998 2.719V3.9999L18.998 4.00007C19.5503 4.00007 19.998 4.44779 19.998 5.00007V18.9999L21.998 19.0001V21.0001H17.998V6.00007L14.998 5.9999V21.0001H1.99805ZM12.998 4.3965L5.99805 5.66923V19.0001H12.998V4.3965ZM11.998 11.0001V13.0001H9.99805V11.0001H11.998Z">
                            </path>
                        </svg>
                    </button>
                </div>
                <div>
                    <h4>Mis Clases</h4>
                    <ul class="sidebar-menu" id="sidebarClassList">
                        <!-- Las clases se cargarán dinámicamente aquí -->
                    </ul>
                    <button class="btn-white-dashed" onclick="openCreateClassroomModal()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M11 11V5H13V11H19V13H13V19H11V13H5V11H11Z"></path>
                        </svg>
                        Crear Nueva Clase
                    </button>
                </div>
            </div>
            <div class="sidebar-footer">
                <div class="profile-section">
                    <div class="profile-avatar" id="profileAvatar"></div>
                    <div class="profile-text">
                        <span class="bienvenido">Bienvenido</span>
                        <span class="nombre-usuario" id="welcomeUser">Nombre Usuario</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content bg-color">
            <div class="header-section">
                <h1 class="header-title">Todas las clases</h1>
                <div class="header-actions">

                </div>
            </div>

            <div id="classroomsContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Cargando classrooms...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para crear classroom -->
    <div id="createClassroomModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCreateClassroomModal()">&times;</span>
            <h2 class="modal-title">Crear Nuevo Classroom</h2>
            <form id="createClassroomForm">
                <div class="form-group">
                    <label class="form-label" for="classroomName">Nombre del Classroom *</label>
                    <input type="text" id="classroomName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="classroomSubject">Materia</label>
                    <input type="text" id="classroomSubject" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label" for="classroomGrade">Nivel Educativo</label>
                    <select id="classroomGrade" class="form-input">
                        <option value="">Seleccionar nivel</option>
                        <option value="secundario">Secundario</option>
                        <option value="terciario">Terciario</option>
                        <option value="universitario">Universitario</option>
                        <option value="posgrado">Posgrado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="classroomDescription">Descripción</label>
                    <textarea id="classroomDescription" class="form-input form-textarea" maxlength="150"></textarea>
                    <div id="charCount">0 / 150</div>
                </div>
                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" class="btn-secondary" onclick="closeCreateClassroomModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Crear Classroom</button>
                </div>
            </form>
        </div>
    </div>
    <div id="deleteClassroomModal" class="modal">
        <div class="modal-content-warning animate-fadeIn">
            <button class="btn-close-modal-absolute" onclick="closeDeleteClassroomModal()">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>

            <!-- Paso 1: Confirmación -->
            <div id="deleteStep1">
                <div class="modal-warning-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM11 7H13V13H11V7Z">
                        </path>
                    </svg>
                </div>
                <h2 class="modal-warning-title">¿Estás seguro?</h2>
                <p class="modal-warning-subtitle">Esta acción eliminará el classroom y no se podrá deshacer.
                </p>
                <div class="modal-warning-actions">
                    <button class="btn-white" onclick="closeDeleteClassroomModal()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM12 10.5858L14.8284 7.75736L16.2426 9.17157L13.4142 12L16.2426 14.8284L14.8284 16.2426L12 13.4142L9.17157 16.2426L7.75736 14.8284L10.5858 12L7.75736 9.17157L9.17157 7.75736L12 10.5858Z">
                            </path>
                        </svg>
                        Cancelar
                    </button>
                    <button class="btn-danger" onclick="showDeleteStep2()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM9 11H11V17H9V11ZM13 11H15V17H13V11ZM9 4V6H15V4H9Z">
                            </path>
                        </svg>
                        Eliminar
                    </button>
                </div>
            </div>

            <!-- Paso 2: Ingreso del código -->
            <div id="deleteStep2" style="display:none;">
                <h2 class="modal-title" style="text-align:center;">Confirmar eliminación</h2>
                <p style="text-align:center; color:#475569;">Ingresa el código de unión para confirmar:</p>

                <!-- Mostrar código para copiar -->
                <div style="text-align:center; margin:8px 0;">
                    <input type="text" id="joinCodeDisplay" readonly class="form-input"
                        style="text-align:center; cursor:pointer;" title="Haz click para copiar">
                </div>

                <input type="text" id="confirmJoinCode" class="form-input" placeholder="Ingresa el código aquí"
                    style="margin-top:12px;">

                <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
                    <button class="btn-white" onclick="closeDeleteClassroomModal()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM12 10.5858L14.8284 7.75736L16.2426 9.17157L13.4142 12L16.2426 14.8284L14.8284 16.2426L12 13.4142L9.17157 16.2426L7.75736 14.8284L10.5858 12L7.75736 9.17157L9.17157 7.75736L12 10.5858Z">
                            </path>
                        </svg>
                        Cancelar
                    </button>
                    <button class="btn-danger" id="confirmDeleteBtn" onclick="confirmDeleteClassroom()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM9 11H11V17H9V11ZM13 11H15V17H13V11ZM9 4V6H15V4H9Z">
                            </path>
                        </svg>
                        Eliminar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Estudiantes -->
    <div id="studentsModal" class="modal">
        <div class="modal-content-students animate-fadeIn">
            <button class="btn-close-modal-absolute" onclick="closeStudentsModal()">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
            <h2>Estudiantes inscritos</h2>
            <ul id="studentsModalList" class="students-list"></ul>
        </div>
    </div>


    <script src="/lib/supabase.js"></script>
    <script src="/JS/config.js"></script>
    <script src="/JS/auth-check.js"></script>
    <script src="/JS/main.js"></script>

    <script src="/JS/Classroom/cr-profesor.js"></script>

</body>

</html>
