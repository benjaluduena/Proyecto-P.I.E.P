<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Classrooms - P.I.E.P.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Css/styles.css">
    <link rel="stylesheet" href="/Css/Clases/clases.css">
    <link rel="stylesheet" href="/Css/Clasroom/clasroom-student.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-logo">
                    <img src="/Assets/Imagenes/PIEP-LOGOS.png" alt="">
                    <button type="button" class="btn-sidebar-menu-icon" id="btnhome">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M1.99805 21.0001V19.0001L3.99805 18.9999V4.83465C3.99805 4.35136 4.34367 3.93723 4.81916 3.85078L14.2907 2.12868C14.6167 2.0694 14.9291 2.28564 14.9884 2.61167C14.9948 2.64708 14.998 2.68301 14.998 2.719V3.9999L18.998 4.00007C19.5503 4.00007 19.998 4.44779 19.998 5.00007V18.9999L21.998 19.0001V21.0001H17.998V6.00007L14.998 5.9999V21.0001H1.99805ZM12.998 4.3965L5.99805 5.66923V19.0001H12.998V4.3965ZM11.998 11.0001V13.0001H9.99805V11.0001H11.998Z">
                            </path>
                        </svg>
                    </button>
                </div>
                <div>
                    <h4>Mis Clases</h4>
                    <ul class="sidebar-menu" id="sidebarClassList">
                        <!-- Las clases se cargarán dinámicamente aquí -->
                    </ul>
                    <button class="btn-white-dashed" onclick="openJoinClassroomModal()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M11 11V5H13V11H19V13H13V19H11V13H5V11H11Z"></path>
                        </svg>
                        Unirse a Classroom
                    </button>
                </div>
            </div>
            <div class="sidebar-footer">
                <div class="profile-section">
                    <div class="profile-avatar" id="profileAvatar"></div>
                    <div class="profile-text">
                        <span class="bienvenido">Bienvenido</span>
                        <span class="nombre-usuario" id="welcomeUser">Nombre Usuario</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content bg-color">
            <div class="header-section">
                <h1 class="header-title">Mis Clases</h1>
            </div>
            <div id="classroomsContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Cargando classrooms...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para unirse a classroom -->
    <div id="joinClassroomModal" class="modal">
        <div class="modal-content-join animate-fadeIn">
            <button class="btn-close-modal-absolute" onclick="closeJoinClassroomModal()">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z">
                    </path>
                </svg>
            </button>
            <h2 class="modal-join-title">Unirse a un Classroom</h2>
            <form id="joinClassroomForm">
                <div class="form-group">
                    <label class="form-label" for="joinCode">Código de Classroom *</label>
                    <input type="text" id="joinCode" class="form-input" placeholder="Ej: ABC123" maxlength="6" required>
                    <small style="color: #666; font-size: 0.8rem;">Ingresa el código de 6 caracteres que te proporcionó
                        tu docente</small>
                </div>
                <div class="modal-join-actions">
                    <button type="button" class="btn-white" onclick="closeJoinClassroomModal()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM12 10.5858L14.8284 7.75736L16.2426 9.17157L13.4142 12L16.2426 14.8284L14.8284 16.2426L12 13.4142L9.17157 16.2426L7.75736 14.8284L10.5858 12L7.75736 9.17157L9.17157 7.75736L12 10.5858Z">
                            </path>
                        </svg>
                        Cancelar
                    </button>
                    <button type="submit" class="btn-purple">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 11C14.7614 11 17 13.2386 17 16V22H15V16C15 14.4023 13.7511 13.0963 12.1763 13.0051L12 13C10.4023 13 9.09634 14.2489 9.00509 15.8237L9 16V22H7V16C7 13.2386 9.23858 11 12 11ZM5.5 14C5.77885 14 6.05009 14.0326 6.3101 14.0942C6.14202 14.594 6.03873 15.122 6.00896 15.6693L6 16L6.0007 16.0856C5.88757 16.0456 5.76821 16.0187 5.64446 16.0069L5.5 16C4.7203 16 4.07955 16.5949 4.00687 17.3555L4 17.5V22H2V17.5C2 15.567 3.567 14 5.5 14ZM18.5 14C20.433 14 22 15.567 22 17.5V22H20V17.5C20 16.7203 19.4051 16.0796 18.6445 16.0069L18.5 16C18.3248 16 18.1566 16.03 18.0003 16.0852L18 16C18 15.3343 17.8916 14.694 17.6915 14.0956C17.9499 14.0326 18.2211 14 18.5 14ZM5.5 8C6.88071 8 8 9.11929 8 10.5C8 11.8807 6.88071 13 5.5 13C4.11929 13 3 11.8807 3 10.5C3 9.11929 4.11929 8 5.5 8ZM18.5 8C19.8807 8 21 9.11929 21 10.5C21 11.8807 19.8807 13 18.5 13C17.1193 13 16 11.8807 16 10.5C16 9.11929 17.1193 8 18.5 8ZM5.5 10C5.22386 10 5 10.2239 5 10.5C5 10.7761 5.22386 11 5.5 11C5.77614 11 6 10.7761 6 10.5C6 10.2239 5.77614 10 5.5 10ZM18.5 10C18.2239 10 18 10.2239 18 10.5C18 10.7761 18.2239 11 18.5 11C18.7761 11 19 10.7761 19 10.5C19 10.2239 18.7761 10 18.5 10ZM12 2C14.2091 2 16 3.79086 16 6C16 8.20914 14.2091 10 12 10C9.79086 10 8 8.20914 8 6C8 3.79086 9.79086 2 12 2ZM12 4C10.8954 4 10 4.89543 10 6C10 7.10457 10.8954 8 12 8C13.1046 8 14 7.10457 14 6C14 4.89543 13.1046 4 12 4Z">
                            </path>
                        </svg>
                        Unirse a la clase
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para salir de classroom -->
    <!-- Modal para salir de classroom -->
    <div id="leaveClassroomModal" class="modal">
        <div class="modal-content-warning animate-fadeIn">
            <button class="btn-close-modal-absolute" onclick="closeLeaveClassroomModal()">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z">
                    </path>
                </svg>
            </button>
            <div class="modal-warning-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM11 15H13V17H11V15ZM11 7H13V13H11V7Z">
                    </path>
                </svg>
            </div>
            <h2 class="modal-warning-title">¿Estás seguro?</h2>
            <p class="modal-warning-subtitle">Esta acción te eliminara de la clase y no se podrá deshacer.</p>
            <div class="modal-warning-actions">
                <button class="btn-white" onclick="closeLeaveClassroomModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM12 10.5858L14.8284 7.75736L16.2426 9.17157L13.4142 12L16.2426 14.8284L14.8284 16.2426L12 13.4142L9.17157 16.2426L7.75736 14.8284L10.5858 12L7.75736 9.17157L9.17157 7.75736L12 10.5858Z">
                        </path>
                    </svg>
                    Cancelar
                </button>
                <button id="confirmLeaveBtn" class="btn-danger">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M4 18H6V20H18V4H6V6H4V3C4 2.44772 4.44772 2 5 2H19C19.5523 2 20 2.44772 20 3V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V18ZM6 11H13V13H6V16L1 12L6 8V11Z">
                        </path>
                    </svg>
                    Salir de la clase
                </button>
            </div>
        </div>
    </div>



    <script src="/lib/supabase.js"></script>
    <script src="/JS/config.js"></script>
    <script src="/JS/auth-check.js"></script>
    <script src="/JS/main.js"></script>
    <script src="/JS/Classroom/cr-profesor.js"></script>
</body>

</html>
