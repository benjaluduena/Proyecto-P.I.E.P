<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Assets/Imagenes/PIEP-LOGOS.png">
  <link rel="shortcut icon" type="image/png" href="/Assets/Imagenes/PIEP-LOGOS.png">
  <link rel="apple-touch-icon" href="/Assets/Imagenes/PIEP-LOGOS.png">
  <title>Multiple Choice</title>
  <link rel="stylesheet" href="/Css/Index/styles.css">
  <link rel="stylesheet" href="/Css/multiple-choice-modern.css">
</head>
<body>
  <main class="mc-container-modern">
    <!-- Header Moderno -->
    <header class="mc-header-modern">
      <div class="mc-header-content">
        <div class="mc-header-left">
          <button class="back-btn-modern" aria-label="Volver">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Volver al inicio
          </button>
          <div class="mc-title-section">
            <h1 class="mc-title">Examen de Opción Múltiple</h1>
            <div id="mcMeta" class="mc-meta">Generado automáticamente con IA</div>
          </div>
        </div>
        <div class="mc-header-right">
          <div class="mc-stats-container">
            <div class="mc-stat-item">
              <span class="mc-stat-number" id="questionCount">0</span>
              <span class="mc-stat-label">Preguntas</span>
            </div>
          </div>
          <div class="mc-actions">
            <button id="downloadBtn" class="btn-modern btn-secondary-modern">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/>
              </svg>
              Descargar
            </button>
            <button id="shareBtn" class="btn-modern btn-primary-modern">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.50-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
              </svg>
              Compartir
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Loading State -->
    <div class="mc-loading-state" id="mcLoadingState">
      <div class="loading-animation">
        <div class="loading-circle"></div>
      </div>
      <h3>Generando Examen</h3>
      <p>Nuestra IA está creando preguntas de opción múltiple basadas en tu documento...</p>
    </div>

    <!-- Questions Container -->
    <section class="mc-questions-container" id="mcQuestionsContainer" style="display: none;">
      <div class="mc-questions-header">
        <div class="mc-progress-info">
          <span class="progress-text">Pregunta <span id="currentQuestion">1</span> de <span id="totalQuestions">10</span></span>
          <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
        </div>
        <div class="mc-timer" id="mcTimer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0012 4c-4.97 0-9 4.03-9 9s4.02 9 9 9a8.994 8.994 0 007.03-14.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
          </svg>
          <span id="timeRemaining">--:--</span>
        </div>
      </div>
      
      <div class="mc-questions-list" id="mcQuestionsList">
        <!-- Las preguntas se cargarán dinámicamente -->
      </div>

      <div class="mc-navigation">
        <button class="btn-nav btn-prev" id="prevBtn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
          Anterior
        </button>
        <div class="question-indicators" id="questionIndicators">
          <!-- Indicadores de preguntas -->
        </div>
        <button class="btn-nav btn-next" id="nextBtn">
          Siguiente
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Results Modal -->
    <div class="mc-modal" id="resultsModal" style="display: none;">
      <div class="mc-modal-content">
        <div class="mc-modal-header">
          <h2>Resultados del Examen</h2>
        </div>
        <div class="mc-modal-body" id="resultsContent">
          <!-- Resultados se cargarán aquí -->
        </div>
        <div class="mc-modal-actions">
          <button class="btn-modern btn-secondary-modern" id="reviewBtn">Revisar Respuestas</button>
          <button class="btn-modern btn-primary-modern" id="restartBtn">Reiniciar Examen</button>
        </div>
      </div>
    </div>
  </main>

  <script src="/lib/supabase.js"></script>
  <script src="/JS/config.js"></script>
  <script src="/JS/auth-check.js"></script>
  <script src="/JS/multiple-choice.js"></script>
</body>
</html>
