<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Assets/Imagenes/PIEP-LOGOS.png">
  <link rel="shortcut icon" type="image/png" href="/Assets/Imagenes/PIEP-LOGOS.png">
  <link rel="apple-touch-icon" href="/Assets/Imagenes/PIEP-LOGOS.png">
  <title>Multiple Choice</title>
  <link rel="stylesheet" href="/Css/Index/styles.css">
  <link rel="stylesheet" href="/Css/multiple-choice-modern.css">
  <link rel="stylesheet" href="/Css/Clases/clases.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>

<body>
  <main class="mc-container-modern">
    <!-- Header Moderno -->
    <header class="mc-header-modern">
      <div class="mc-header-content">
        <div class="mc-header-left">
          <button class="btn-white-icon" id="closeBtn" aria-label="Cerrar">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M1.99805 21.0001V19.0001L3.99805 18.9999V4.83465C3.99805 4.35136 4.34367 3.93723 4.81916 3.85078L14.2907 2.12868C14.6167 2.0694 14.9291 2.28564 14.9884 2.61167C14.9948 2.64708 14.998 2.68301 14.998 2.719V3.9999L18.998 4.00007C19.5503 4.00007 19.998 4.44779 19.998 5.00007V18.9999L21.998 19.0001V21.0001H17.998V6.00007L14.998 5.9999V21.0001H1.99805ZM12.998 4.3965L5.99805 5.66923V19.0001H12.998V4.3965ZM11.998 11.0001V13.0001H9.99805V11.0001H11.998Z">
              </path>
            </svg>
          </button>
          <div class="mc-title-section">
            <!-- <h1 class="mc-title">Examen de Opción Múltiple</h1> -->
            <div id="mcMeta" class="mc-meta">Generado automáticamente con IA</div>
          </div>
        </div>
        <div class="mc-header-right">
          <!-- <div class="mc-stats-container">
            <div class="mc-stat-item">
              <span class="mc-stat-number" id="questionCount">0</span>
              <span class="mc-stat-label">Preguntas</span>
            </div>
          </div> -->
          <div class="mc-actions">
            <button id="downloadBtn" class="btn-white">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M13 10H18L12 16L6 10H11V3H13V10ZM4 19H20V12H22V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V12H4V19Z"></path></svg>
              Descargar
            </button>
            <button class="btn-purple" id="shareBtn" aria-label="Compartir">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z">
                </path>
              </svg>
              Compartir
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Loading State -->
    <div class="mc-loading-state" id="mcLoadingState">
      <div class="loading-animation">
        <div class="loading-circle"></div>
      </div>
      <h3>Generando Examen</h3>
      <p>Nuestra IA está creando preguntas de opción múltiple basadas en tu documento...</p>
    </div>

    <!-- Questions Container -->
    <section class="mc-questions-container" id="mcQuestionsContainer" style="display: none;">
      <div class="mc-questions-header">
        <div class="mc-progress-info">
          <span class="progress-text">Pregunta <span id="currentQuestion">1</span> de <span
              id="totalQuestions">10</span></span>
          <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
        </div>
        <!-- <div class="mc-timer" id="mcTimer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0012 4c-4.97 0-9 4.03-9 9s4.02 9 9 9a8.994 8.994 0 007.03-14.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z" />
          </svg>
          <span id="timeRemaining">--:--</span>
        </div> -->
      </div>

      <div class="mc-questions-list" id="mcQuestionsList">
        <!-- Las preguntas se cargarán dinámicamente -->
      </div>

      <div class="mc-navigation">
        <button class="btn-purple" id="prevBtn" disabled>
          Anterior
        </button>
        <div class="question-indicators" id="questionIndicators">
          <!-- Indicadores de preguntas -->
        </div>
        <button class="btn-purple" id="nextBtn">
          Siguiente
        </button>
      </div>
    </section>

    <!-- Results Modal -->
    <div class="mc-modal" id="resultsModal" style="display: none;">
      <div class="mc-modal-content">
        <div class="mc-modal-header">
          <h2>Resultados del Examen</h2>
        </div>
        <div class="mc-modal-body" id="resultsContent">
          <!-- Resultados se cargarán aquí -->
        </div>
        <div class="mc-modal-actions">
          <button class="btn-modern btn-secondary-modern" id="reviewBtn">Revisar Respuestas</button>
          <button class="btn-modern btn-primary-modern" id="restartBtn">Reiniciar Examen</button>
        </div>
      </div>
    </div>
  </main>

  <script src="/lib/supabase.js"></script>
  <script src="/JS/config.js"></script>
  <script src="/JS/auth-check.js"></script>
  <script src="/JS/multiple-choice.js"></script>
</body>

</html>
