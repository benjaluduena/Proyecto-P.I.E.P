<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>StudyAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Css/styles.css">
  <link rel="stylesheet" href="/Css/home.css">
  <link rel="stylesheet" href="/Css/calendario.css">
  <script src="lib/supabase.js"></script>
  <script src="/JS/config.js"></script>
  <!-- Sistema modular unificado -->
  <script type="module" src="/JS/modules/app.js"></script>
</head>

<body>
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">

      <div>

        <!-- Logo -->
        <div class="logo-container">
          <img class="logo" src="/Assets/Imagenes/Logo.png" alt="">
        </div>

        <!-- Sidebar Menu -->
        <nav class="menu">

          <button onclick="cargarSeccion('home')" type="button" class="menu-item active">
            <span class="sidebar-ico">
              <svg>
                <use href="/Assets/sprite.svg#icon-home"></use>
              </svg>
            </span>
            Inicio
          </button>

          <button onclick="cargarSeccion('calendario')" type="button" class="menu-item">
            <span class="sidebar-ico">
              <svg>
                <use href="/Assets/sprite.svg#icon-calendar"></use>
              </svg>
            </span>
            Calendario
          </button>

          <button type="button" class="menu-item">
            <span class="sidebar-ico">
              <svg>
                <use href="/Assets/sprite.svg#icon-history"></use>
              </svg>
            </span>
            Historial
          </button>

        </nav>

      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">

          <button type="button" class="menu-item" id="btnCambiarPlan">
            <span class="sidebar-ico">
              <svg>
                <use href="/Assets/sprite.svg#icon-user"></use>
              </svg>
            </span>
            Cambiar plan
          </button>

          <button type="button" class="menu-item">
            <span class="sidebar-ico">
              <svg>
                <use href="/Assets/sprite.svg#icon-help"></use>
              </svg>
            </span>
            Ayuda y Soporte
          </button>

        <button type="button" class="menu-item">
          <span class="sidebar-ico">
            <svg>
              <use href="/Assets/sprite.svg#icon-logout"></use>
            </svg>
          </span>
          Salir
        </button>

        <!-- Información del Usuario -->
        <div class="user-profile" id="userProfile">
          <div class="user-avatar" id="userAvatar">
            <img src="/Assets/Imagenes/usuario-sin-foto.png" alt="Foto de perfil" class="avatar-img">
          </div>
          <div class="user-info">
            <div class="user-name">Juan Pérez</div>
            <div class="user-email">juan.perez@email.com</div>
          </div>
          <!-- Dropdown Menu -->
          <div class="profile-dropdown" id="profileDropdown">
            <div id="btnAjustes" class="dropdown-item">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <use href="/Assets/sprite.svg#icon-settings"></use>
              </svg>
              Ajustes
            </div>
            <div class="dropdown-item" id="btnCerrarSesion">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />
              </svg>
              Cerrar sesión
            </div>
          </div>


        </div>

    </aside>

    <!-- Main -->
    <main id="contenido">
      <!-- Aquí se carga el contenido dinámico -->
    </main>

    <!-- Scripts legacy mantenidos para compatibilidad -->
    <script src="/JS/main.js"></script>
    <script src="/JS/suscripciones.js"></script>
</body>

</html>
