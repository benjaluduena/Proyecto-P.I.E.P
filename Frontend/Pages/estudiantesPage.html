<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: https://fqmpmseabhtvahzdavej.supabase.co;">
  <title>Aula - P.I.E.P.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Css/Clasroom/estudiantes-page.css">
  <link rel="stylesheet" href="/Css/Clases/clases.css">
</head>

<body class="bg-color">
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div>
        <div class="classroom-title">
          <span id="classroomTitle">
            <div class="loading">
              <div class="loading-spinner"></div>
              Cargando...
            </div>
          </span>
        </div>
        <div class="classroom-subtitle" id="classroomSubtitle">
          <div class="loading">
            <div class="loading-spinner"></div>
            Cargando información...
          </div>
        </div>
      </div>
      <button class="btn-white" id="backBtn">
        <svg width="16" height="16" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M5.82843 6.99955L8.36396 9.53509L6.94975 10.9493L2 5.99955L6.94975 1.0498L8.36396 2.46402L5.82843 4.99955H13C17.4183 4.99955 21 8.58127 21 12.9996C21 17.4178 17.4183 20.9996 13 20.9996H4V18.9996H13C16.3137 18.9996 19 16.3133 19 12.9996C19 9.68584 16.3137 6.99955 13 6.99955H5.82843Z">
          </path>
        </svg>
        Regresar
      </button>
      <div style="display: none;" class="classroom-stats">
        <div class="stat-item">
          <span>📝</span>
          <span id="postsCount">0 publicaciones</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="content">
    <!-- Posts Container -->
    <section id="postsContainer" class="posts-container">
      <div class="loading" style="text-align: center; padding: 2rem;">
        <div class="loading-spinner"></div>
        Cargando publicaciones...
      </div>
    </section>
  </main>

  <!-- Notification Container -->
  <div id="notificationContainer"></div>


  <!-- Modal Material IA -->
  <div class="material-preview">
    <!-- Modal Material IA -->
    <div id="aiMaterialModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">📚 Material de IA</h2>
          <button class="btn-close-modal" onclick="document.getElementById('aiMaterialModal').classList.remove('show')">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z">
              </path>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <!-- Aquí se inyecta TODO el material -->
          <div class="material-preview">
            <p style="color: var(--gray-500); text-align: center;">Cargando material...</p>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-white"
            onclick="document.getElementById('aiMaterialModal').classList.remove('show')">Cancelar</button>
        </div>
      </div>
    </div>


  </div>

  <script src="/JS/Classroom/page-estudiantes.js"></script>
</body>

</html>
