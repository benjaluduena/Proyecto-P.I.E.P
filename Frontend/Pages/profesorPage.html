<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: https://fqmpmseabhtvahzdavej.supabase.co;">
  <title>Aula - P.I.E.P.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Css/Clasroom/profesor-page.css">
  <link rel="stylesheet" href="/Css/Clases/clases.css">
</head>

<body class="bg-color">

  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div>
        <div class="classroom-title">
          <span id="classroomTitle">
            <div class="loading">
              <div class="loading-spinner"></div>
              Cargando...
            </div>
          </span>
        </div>
        <div class="classroom-subtitle" id="classroomSubtitle">
          <div class="loading">
            <div class="loading-spinner"></div>
            Cargando información...
          </div>
        </div>
      </div>
      <button class="btn-white" id="backBtn">
        <svg width="16" height="16" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M5.82843 6.99955L8.36396 9.53509L6.94975 10.9493L2 5.99955L6.94975 1.0498L8.36396 2.46402L5.82843 4.99955H13C17.4183 4.99955 21 8.58127 21 12.9996C21 17.4178 17.4183 20.9996 13 20.9996H4V18.9996H13C16.3137 18.9996 19 16.3133 19 12.9996C19 9.68584 16.3137 6.99955 13 6.99955H5.82843Z">
          </path>
        </svg>
        Regresar
      </button>
      <div style="display: none;" class="classroom-stats">
        <div class="stat-item">
          <span>📝</span>
          <span id="postsCount">0 publicaciones</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="content">
    <div class="content-container">
      <!-- New Post Form -->
      <section class="new-post-card">
        <h3 class="form-title">
          Crear nueva publicación
        </h3>

        <form id="newPostForm">
          <div class="form-group">
            <div class="textarea-wrapper">
              <textarea id="postContent" class="post-textarea" placeholder="¿Qué quieres compartir con tu clase?"
                maxlength="2000" required></textarea>
              <div class="char-counter">
                <span id="charCount">0</span>/2000
              </div>
            </div>
          </div>

          <div class="form-group">

            <img id="filePreview" class="file-preview" alt="Vista previa de imagen" />

            <div id="fileInfo" class="file-info">
              <div class="file-info-content">
                <div class="file-icon" id="fileIcon">📄</div>
                <div>
                  <div id="fileName" style="font-weight: 500;"></div>
                  <div id="fileSize" style="font-size: 0.875rem; color: var(--gray-500);"></div>
                </div>
                <button type="button" class="remove-file-btn" id="removeFileBtn">
                  <span>❌</span>
                </button>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <div class="form-actions-left">
              <div class="file-input-wrapper">
                <input type="file" id="postFile" class="file-input" accept="image/*,application/pdf,.doc,.docx">
                <label for="postFile" class="file-input-label">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path
                      d="M14.8287 7.75737L9.1718 13.4142C8.78127 13.8047 8.78127 14.4379 9.1718 14.8284C9.56232 15.219 10.1955 15.219 10.586 14.8284L16.2429 9.17158C17.4144 8.00001 17.4144 6.10052 16.2429 4.92894C15.0713 3.75737 13.1718 3.75737 12.0002 4.92894L6.34337 10.5858C4.39075 12.5384 4.39075 15.7042 6.34337 17.6569C8.29599 19.6095 11.4618 19.6095 13.4144 17.6569L19.0713 12L20.4855 13.4142L14.8287 19.0711C12.095 21.8047 7.66283 21.8047 4.92916 19.0711C2.19549 16.3374 2.19549 11.9053 4.92916 9.17158L10.586 3.51473C12.5386 1.56211 15.7045 1.56211 17.6571 3.51473C19.6097 5.46735 19.6097 8.63317 17.6571 10.5858L12.0002 16.2427C10.8287 17.4142 8.92916 17.4142 7.75759 16.2427C6.58601 15.0711 6.58601 13.1716 7.75759 12L13.4144 6.34316L14.8287 7.75737Z">
                    </path>
                  </svg>
                </label>
              </div>
            </div>
            <div class="form-actions-right">
              <button type="button" class="btn-white" id="clearFormBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M8.58564 8.85449L3.63589 13.8042L8.83021 18.9985L9.99985 18.9978V18.9966H11.1714L14.9496 15.2184L8.58564 8.85449ZM9.99985 7.44027L16.3638 13.8042L19.1922 10.9758L12.8283 4.61185L9.99985 7.44027ZM13.9999 18.9966H20.9999V20.9966H11.9999L8.00229 20.9991L1.51457 14.5113C1.12405 14.1208 1.12405 13.4877 1.51457 13.0971L12.1212 2.49053C12.5117 2.1 13.1449 2.1 13.5354 2.49053L21.3136 10.2687C21.7041 10.6592 21.7041 11.2924 21.3136 11.6829L13.9999 18.9966Z">
                  </path>
                </svg>
                Limpiar
              </button>
              <button type="button" class="btn-white" id="shareResourceBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M3.08697 9H20.9134C21.4657 9 21.9134 9.44772 21.9134 10C21.9134 10.0277 21.9122 10.0554 21.9099 10.083L21.0766 20.083C21.0334 20.6013 20.6001 21 20.08 21H3.9203C3.40021 21 2.96695 20.6013 2.92376 20.083L2.09042 10.083C2.04456 9.53267 2.45355 9.04932 3.00392 9.00345C3.03155 9.00115 3.05925 9 3.08697 9ZM4.84044 19H19.1599L19.8266 11H4.17377L4.84044 19ZM13.4144 5H20.0002C20.5525 5 21.0002 5.44772 21.0002 6V7H3.00017V4C3.00017 3.44772 3.44789 3 4.00017 3H11.4144L13.4144 5Z">
                  </path>
                </svg>
                Compartir Material
              </button>
              <button type="submit" class="btn-purple" id="createPostBtn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M4 19H20V12H22V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V12H4V19ZM13 9V16H11V9H6L12 3L18 9H13Z">
                  </path>
                </svg>
                Publicar
              </button>
            </div>


          </div>
        </form>
      </section>
      <!-- Lista de Recursos -->


      <!-- Posts Container -->
      <section id="postsContainer" class="posts-container">
        <div class="loading" style="text-align: center; padding: 2rem;">
          <div class="loading-spinner"></div>
          Cargando publicaciones...
        </div>
      </section>
    </div>
  </main>

  <!-- Notification Container -->
  <div id="notificationContainer"></div>

  <!-- Modal para compartir materiales de IA -->
  <div id="shareMaterialModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">
          Compartir Material de IA
        </h3>
        <button class="btn-close-modal" onclick="closeShareMaterialModal()">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="materials-section">
          <div class="section-header">
            <h4>Selecciona un material para compartir</h4>
            <div class="loading" id="materialsLoading" style="display: none;">
              <div class="loading-spinner"></div>
              Cargando materiales...
            </div>
          </div>

          <div id="materialsList" class="materials-list">
            <!-- Los materiales se cargarán aquí dinámicamente -->
          </div>
        </div>

        <div class="preview-section" id="previewSection" style="display: none;">
          <h4>Vista previa del material</h4>
          <div id="materialPreview" class="material-preview">
            <!-- La vista previa se mostrará aquí -->
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-white" onclick="closeShareMaterialModal()">
          Cancelar
        </button>
        <button type="button" class="btn-purple" id="shareMaterialBtn" onclick="shareSelectedMaterial()" disabled>
          <span>📤</span>
          Compartir en Classroom
        </button>
      </div>
    </div>
  </div>

  <script src="/JS/Classroom/page-profesor.js"></script>

</body>

</html>
