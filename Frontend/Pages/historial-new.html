<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Historial - StudyAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ===== VARIABLES CSS SIGUIENDO LA LÍNEA DEL PROYECTO ===== */
    :root {
      --primary-color: #a259fa;
      --secondary-color: #f18531;
      --accent-color: #f2edfe;
      --text-dark: #333;
      --text-light: #666;
      --text-lighter: #999;
      --bg-light: #f9f9f9;
      --white: #ffffff;
      --border-color: #f1f1f1;
      --shadow-light: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-medium: 0 8px 25px rgba(0, 0, 0, 0.12);
      --border-radius: 15px;
      --border-radius-small: 10px;
      --transition: all 0.6s ease;
      --transition-fast: all 0.3s ease;
    }

    /* Reset y base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ===== WRAPPER PRINCIPAL ===== */
    .historial-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
    }

    /* ===== HEADER MINIMALISTA ===== */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .main-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    .title-icon {
      font-size: 2rem;
      filter: saturate(0.8);
    }

    .subtitle {
      color: var(--text-light);
      font-size: 1rem;
      font-weight: 400;
      margin-bottom: 30px;
    }

    /* ===== BÚSQUEDA MINIMALISTA ===== */
    .search-container {
      position: relative;
      max-width: 500px;
      margin: 0 auto 30px auto;
    }

    .search-input {
      width: 100%;
      padding: 16px 50px 16px 45px;
      border: none;
      background: var(--white);
      border-radius: 25px;
      font-size: 15px;
      color: var(--text-dark);
      box-shadow: var(--shadow-light);
      transition: var(--transition-fast);
      outline: none;
    }

    .search-input:focus {
      box-shadow: 0 4px 25px rgba(162, 89, 250, 0.15);
      transform: translateY(-1px);
    }

    .search-input::placeholder {
      color: var(--text-lighter);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-lighter);
      font-size: 16px;
    }

    .clear-btn {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border: none;
      background: var(--text-lighter);
      color: var(--white);
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: var(--transition-fast);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-btn:hover {
      background: var(--primary-color);
      transform: translateY(-50%) scale(1.1);
    }

    /* ===== FILTROS MINIMALISTAS ===== */
    .filters {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .filter-chip {
      padding: 8px 16px;
      border: none;
      background: var(--white);
      color: var(--text-light);
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-light);
    }

    .filter-chip:hover {
      color: var(--primary-color);
      transform: translateY(-1px);
    }

    .filter-chip.active {
      background: var(--primary-color);
      color: var(--white);
      transform: translateY(-1px);
    }

    /* ===== ESTADÍSTICAS ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-item {
      background: var(--white);
      padding: 20px;
      border-radius: var(--border-radius);
      text-align: center;
      box-shadow: var(--shadow-light);
      transition: var(--transition-fast);
    }

    .stat-item:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-medium);
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-color);
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* ===== CONTENIDO ===== */
    .content {
      min-height: 400px;
      position: relative;
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-color);
      border-top: 3px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-state p {
      color: var(--text-light);
      font-weight: 500;
    }

    /* ===== GRID DE CONTENIDO ===== */
    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .content-item {
      background: var(--white);
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: var(--shadow-light);
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.4s ease;
    }

    .content-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--primary-color);
      opacity: 0;
      transition: var(--transition-fast);
    }

    .content-item:hover::before {
      opacity: 1;
    }

    .content-item:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-medium);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      gap: 12px;
    }

    .item-type {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--primary-color);
      font-size: 14px;
    }

    .type-icon {
      font-size: 1.2rem;
    }

    .item-actions {
      display: flex;
      gap: 4px;
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--text-lighter);
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .action-btn:hover {
      background: var(--accent-color);
      color: var(--primary-color);
    }

    .action-btn.favorite.active {
      color: #e74c3c;
    }

    .pdf-title {
      font-size: 13px;
      color: var(--text-lighter);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .content-preview {
      margin-bottom: 16px;
      min-height: 60px;
    }

    .preview-text {
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .content-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-lighter);
    }

    .creation-date {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .primary-action {
      padding: 6px 12px;
      background: var(--accent-color);
      color: var(--primary-color);
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .primary-action:hover {
      background: var(--primary-color);
      color: var(--white);
    }

    /* ===== ESTADOS VACÍOS ===== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      background: var(--white);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-light);
    }

    .empty-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.6;
    }

    .empty-state h3 {
      font-size: 1.5rem;
      color: var(--text-dark);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .empty-state p {
      color: var(--text-light);
      margin-bottom: 24px;
      max-width: 300px;
      line-height: 1.5;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--primary-color);
      color: var(--white);
      text-decoration: none;
      border-radius: var(--border-radius-small);
      font-weight: 600;
      font-size: 14px;
      transition: var(--transition);
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: #8f47e8;
      transform: translateY(-2px);
      box-shadow: var(--shadow-medium);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .historial-wrapper {
        padding: 20px 16px;
      }

      .main-title {
        font-size: 1.8rem;
      }

      .content-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .stats {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .filters {
        gap: 6px;
      }

      .filter-chip {
        padding: 6px 12px;
        font-size: 13px;
      }

      .search-input {
        font-size: 16px;
      }

      .content-item {
        padding: 20px;
      }
    }

    @media (max-width: 480px) {
      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .empty-state {
        padding: 40px 20px;
      }

      .empty-icon {
        font-size: 3rem;
      }
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--primary-color);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-medium);
      z-index: 1000;
      transform: translateX(100%);
      transition: all 0.3s ease;
      max-width: 300px;
    }

    .toast.show {
      transform: translateX(0);
    }

    /* ===== UTILIDADES ===== */
    .hidden { display: none !important; }
    .show { display: block !important; }
  </style>
</head>

<body>
  <div class="historial-wrapper">
    <!-- Header -->
    <header class="header">
      <h1 class="main-title">
        <span class="title-icon">📚</span>
        Mi Historial
      </h1>
      <p class="subtitle">Todo tu contenido de estudio organizado</p>
    </header>

    <!-- Búsqueda -->
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar en tu historial..." class="search-input">
      <button id="clearSearch" class="clear-btn">×</button>
    </div>

    <!-- Filtros -->
    <div class="filters" id="filters">
      <button class="filter-chip active" data-filter="all">Todos</button>
      <button class="filter-chip" data-filter="favorites">❤️ Favoritos</button>
      <button class="filter-chip" data-filter="resumen">📄 Resúmenes</button>
      <button class="filter-chip" data-filter="multiple_choice">🎯 Quiz</button>
      <button class="filter-chip" data-filter="flashcards">🗂️ Tarjetas</button>
      <button class="filter-chip" data-filter="mapa_mental">🧠 Mapas</button>
    </div>

    <!-- Estadísticas -->
    <div class="stats">
      <div class="stat-item">
        <div class="stat-number" id="totalItems">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="totalFavorites">0</div>
        <div class="stat-label">Favoritos</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="totalPdfs">0</div>
        <div class="stat-label">PDFs</div>
      </div>
    </div>

    <!-- Contenido principal -->
    <main class="content">
      <!-- Loading -->
      <div class="loading-state" id="loadingState">
        <div class="loading-spinner"></div>
        <p>Cargando tu historial...</p>
      </div>

      <!-- Grid de contenido -->
      <div class="content-grid hidden" id="contentGrid">
        <!-- Contenido dinámico -->
      </div>

      <!-- Estado vacío -->
      <div class="empty-state hidden" id="emptyState">
        <div class="empty-icon">📚</div>
        <h3>Tu historial está vacío</h3>
        <p>Comienza subiendo un PDF para generar tu primer contenido de estudio.</p>
        <a href="../index.html" class="btn-primary">Subir PDF</a>
      </div>

      <!-- Sin resultados -->
      <div class="empty-state hidden" id="noResults">
        <div class="empty-icon">🔍</div>
        <h3>Sin resultados</h3>
        <p>No encontramos contenido que coincida con tu búsqueda.</p>
        <button id="clearFiltersBtn" class="btn-primary">Limpiar búsqueda</button>
      </div>
    </main>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ===== HISTORIAL MINIMALISTA - JAVASCRIPT ===== //
    
    class HistorialMinimal {
      constructor() {
        this.data = [];
        this.filteredData = [];
        this.currentFilter = 'all';
        this.searchQuery = '';
        this.favorites = this.loadFavorites();
        this.isLoading = false;
        
        this.init();
      }

      async init() {
        console.log('🎨 Inicializando Historial Minimalista...');
        
        this.bindElements();
        this.setupEventListeners();
        await this.loadData();
        this.render();
        
        console.log('✅ Historial listo');
      }

      bindElements() {
        this.elements = {
          contentGrid: document.getElementById('contentGrid'),
          loadingState: document.getElementById('loadingState'),
          emptyState: document.getElementById('emptyState'),
          noResults: document.getElementById('noResults'),
          searchInput: document.getElementById('searchInput'),
          clearSearch: document.getElementById('clearSearch'),
          totalItems: document.getElementById('totalItems'),
          totalFavorites: document.getElementById('totalFavorites'),
          totalPdfs: document.getElementById('totalPdfs'),
          clearFiltersBtn: document.getElementById('clearFiltersBtn'),
          toast: document.getElementById('toast')
        };
        
        this.elements.filterChips = document.querySelectorAll('.filter-chip');
      }

      setupEventListeners() {
        // Búsqueda
        let searchTimeout;
        this.elements.searchInput?.addEventListener('input', (e) => {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(() => this.handleSearch(e.target.value), 300);
        });

        // Limpiar búsqueda
        this.elements.clearSearch?.addEventListener('click', () => this.clearSearch());

        // Filtros
        this.elements.filterChips.forEach(chip => {
          chip.addEventListener('click', () => this.handleFilter(chip.dataset.filter));
        });

        // Limpiar filtros
        this.elements.clearFiltersBtn?.addEventListener('click', () => this.clearAllFilters());
      }

      async loadData() {
        this.showLoading(true);
        
        try {
          // Simular carga de API
          await new Promise(resolve => setTimeout(resolve, 1000));
          
          // Datos de demostración
          this.data = this.getDemoData();
          this.processData();
          
          console.log(`📊 ${this.data.length} elementos cargados`);
        } catch (error) {
          console.error('Error cargando datos:', error);
          this.data = [];
        } finally {
          this.showLoading(false);
        }
      }

      processData() {
        this.data = this.data.map(item => ({
          ...item,
          isFavorite: this.favorites.includes(item.id.toString()),
          displayDate: this.formatDate(item.created_at),
          searchText: this.generateSearchText(item)
        }));
        
        this.applyFilters();
      }

      generateSearchText(item) {
        const parts = [
          item.pdf_title || item.pdf_name || '',
          this.getTypeName(item.type),
          this.extractContentText(item.content, item.type)
        ];
        
        return parts.join(' ').toLowerCase();
      }

      extractContentText(content, type) {
        if (!content) return '';
        
        try {
          switch(type) {
            case 'resumen':
              return content.resumen_general || '';
            case 'multiple_choice':
            case 'verdadero_falso':
              return (content.preguntas || []).map(p => p.enunciado).join(' ');
            case 'flashcards':
              return (content.cards || []).map(card => `${card.pregunta || card.frente} ${card.respuesta || card.reverso}`).join(' ');
            default:
              return JSON.stringify(content);
          }
        } catch {
          return '';
        }
      }

      applyFilters() {
        let filtered = [...this.data];

        // Filtro por tipo o favoritos
        if (this.currentFilter === 'favorites') {
          filtered = filtered.filter(item => item.isFavorite);
        } else if (this.currentFilter !== 'all') {
          filtered = filtered.filter(item => item.type === this.currentFilter);
        }

        // Filtro por búsqueda
        if (this.searchQuery.trim()) {
          const query = this.searchQuery.toLowerCase();
          filtered = filtered.filter(item => item.searchText.includes(query));
        }

        // Ordenar por fecha
        filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        this.filteredData = filtered;
      }

      render() {
        this.applyFilters();
        this.updateStats();
        this.renderContent();
      }

      renderContent() {
        const container = this.elements.contentGrid;
        if (!container) return;

        if (this.filteredData.length === 0) {
          this.showEmptyState();
          return;
        }

        this.hideEmptyStates();
        container.classList.remove('hidden');
        
        const html = this.filteredData.map(item => this.generateItemHTML(item)).join('');
        container.innerHTML = html;
      }

      generateItemHTML(item) {
        const preview = this.generatePreview(item.content, item.type);
        const actionText = this.getActionText(item.type);
        
        return `
          <div class="content-item">
            <div class="item-header">
              <div class="item-type">
                <span class="type-icon">${this.getTypeIcon(item.type)}</span>
                <span>${this.getTypeName(item.type)}</span>
              </div>
              <div class="item-actions">
                <button class="action-btn favorite ${item.isFavorite ? 'active' : ''}" 
                        onclick="historial.toggleFavorite('${item.id}')" 
                        title="${item.isFavorite ? 'Quitar de favoritos' : 'Agregar a favoritos'}">
                  ❤️
                </button>
                <button class="action-btn delete" 
                        onclick="historial.deleteItem('${item.id}')" 
                        title="Eliminar">
                  🗑️
                </button>
              </div>
            </div>
            
            <div class="pdf-title">
              📄 ${this.truncate(item.pdf_title || item.pdf_name, 40)}
            </div>
            
            <div class="content-preview">
              <div class="preview-text">${preview}</div>
            </div>
            
            <div class="content-meta">
              <span class="creation-date">
                🕒 ${item.displayDate}
              </span>
              <button class="primary-action">
                ${actionText}
              </button>
            </div>
          </div>
        `;
      }

      generatePreview(content, type) {
        if (!content) return 'Sin contenido disponible';

        try {
          switch(type) {
            case 'resumen':
              return this.truncate(content.resumen_general || 'Resumen no disponible', 120);
            case 'multiple_choice':
              return `${content.preguntas?.length || 0} preguntas de opción múltiple`;
            case 'verdadero_falso':
              return `${content.preguntas?.length || 0} preguntas de verdadero o falso`;
            case 'flashcards':
              return `${content.cards?.length || 0} tarjetas de estudio`;
            case 'mapa_mental':
              return `Mapa mental: ${content.nodo_central || 'Sin título'}`;
            default:
              return 'Contenido de estudio disponible';
          }
        } catch {
          return 'Error al procesar contenido';
        }
      }

      getActionText(type) {
        const actions = {
          'resumen': 'Leer',
          'multiple_choice': 'Practicar',
          'verdadero_falso': 'Practicar',
          'flashcards': 'Estudiar',
          'mapa_mental': 'Ver Mapa'
        };
        return actions[type] || 'Ver';
      }

      handleSearch(query) {
        this.searchQuery = query.trim();
        
        if (this.elements.clearSearch) {
          this.elements.clearSearch.style.display = this.searchQuery ? 'flex' : 'none';
        }
        
        this.render();
      }

      clearSearch() {
        if (this.elements.searchInput) {
          this.elements.searchInput.value = '';
        }
        this.handleSearch('');
      }

      handleFilter(filter) {
        if (this.currentFilter === filter) return;
        
        this.currentFilter = filter;
        
        this.elements.filterChips.forEach(chip => {
          chip.classList.toggle('active', chip.dataset.filter === filter);
        });
        
        this.render();
      }

      clearAllFilters() {
        this.currentFilter = 'all';
        this.searchQuery = '';
        
        if (this.elements.searchInput) {
          this.elements.searchInput.value = '';
        }
        
        if (this.elements.clearSearch) {
          this.elements.clearSearch.style.display = 'none';
        }
        
        this.elements.filterChips.forEach(chip => {
          chip.classList.toggle('active', chip.dataset.filter === 'all');
        });
        
        this.render();
      }

      toggleFavorite(itemId) {
        const item = this.data.find(i => i.id == itemId);
        if (!item) return;

        const itemIdStr = itemId.toString();
        
        if (item.isFavorite) {
          this.favorites = this.favorites.filter(id => id !== itemIdStr);
          item.isFavorite = false;
          this.showToast('💔 Removido de favoritos');
        } else {
          this.favorites.push(itemIdStr);
          item.isFavorite = true;
          this.showToast('❤️ Agregado a favoritos');
        }
        
        this.saveFavorites();
        this.render();
      }

      deleteItem(itemId) {
        const item = this.data.find(i => i.id == itemId);
        if (!item) return;

        const confirmed = confirm(`¿Eliminar este ${this.getTypeName(item.type).toLowerCase()}?`);
        if (!confirmed) return;

        this.data = this.data.filter(i => i.id != itemId);
        this.favorites = this.favorites.filter(id => id !== itemId.toString());
        this.saveFavorites();
        
        this.render();
        this.showToast('🗑️ Elemento eliminado');
      }

      showLoading(show) {
        if (this.elements.loadingState) {
          this.elements.loadingState.classList.toggle('hidden', !show);
        }
        if (this.elements.contentGrid) {
          this.elements.contentGrid.classList.toggle('hidden', show);
        }
      }

      showEmptyState() {
        this.hideAllStates();
        
        if (this.searchQuery || this.currentFilter !== 'all') {
          this.elements.noResults?.classList.remove('hidden');
        } else {
          this.elements.emptyState?.classList.remove('hidden');
        }
      }

      hideEmptyStates() {
        this.elements.emptyState?.classList.add('hidden');
        this.elements.noResults?.classList.add('hidden');
      }

      hideAllStates() {
        this.hideEmptyStates();
        if (this.elements.contentGrid) {
          this.elements.contentGrid.classList.add('hidden');
        }
      }

      updateStats() {
        if (this.elements.totalItems) {
          this.elements.totalItems.textContent = this.filteredData.length;
        }
        if (this.elements.totalFavorites) {
          this.elements.totalFavorites.textContent = this.favorites.length;
        }
        if (this.elements.totalPdfs) {
          const uniquePdfs = [...new Set(this.data.map(item => item.pdf_id))].length;
          this.elements.totalPdfs.textContent = uniquePdfs;
        }
      }

      // Utilidades
      getTypeName(type) {
        const names = {
          'resumen': 'Resumen',
          'multiple_choice': 'Multiple Choice',
          'verdadero_falso': 'Verdadero o Falso',
          'mapa_mental': 'Mapa Mental',
          'flashcards': 'Flashcards'
        };
        return names[type] || type;
      }

      getTypeIcon(type) {
        const icons = {
          'resumen': '📄',
          'multiple_choice': '🎯',
          'verdadero_falso': '✅',
          'mapa_mental': '🧠',
          'flashcards': '🗂️'
        };
        return icons[type] || '📝';
      }

      formatDate(dateString) {
        if (!dateString) return 'Sin fecha';
        
        try {
          const date = new Date(dateString);
          const now = new Date();
          const diffDays = Math.ceil((now - date) / (1000 * 60 * 60 * 24));
          
          if (diffDays === 0) return 'Hoy';
          if (diffDays === 1) return 'Ayer';
          if (diffDays < 7) return `Hace ${diffDays} días`;
          
          return date.toLocaleDateString('es-ES', {
            month: 'short',
            day: 'numeric'
          });
        } catch {
          return 'Fecha inválida';
        }
      }

      truncate(text, length) {
        if (!text || text.length <= length) return text || '';
        return text.substring(0, length) + '...';
      }

      loadFavorites() {
        try {
          const favorites = localStorage.getItem('studyai-favorites');
          return favorites ? JSON.parse(favorites) : [];
        } catch {
          return [];
        }
      }

      saveFavorites() {
        try {
          localStorage.setItem('studyai-favorites', JSON.stringify(this.favorites));
        } catch (error) {
          console.warn('Error guardando favoritos:', error);
        }
      }

      showToast(message) {
        const toast = this.elements.toast;
        if (!toast) return;
        
        toast.textContent = message;
        toast.classList.add('show');
        
        setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }
