<!-- Historial de Estudio - P.I.E.P. -->
<div id="loadingIndicator" class="loading-indicator" style="display: none;" role="status" aria-live="polite">
  <div class="loading-spinner" aria-hidden="true"></div>
  <div class="loading-text">Cargando historial...</div>
</div>

<!-- Main container -->
<div class="historial-container">
  <!-- Header section -->
  <header class="historial-header">
    <div class="header-content">
      <div class="title-section">
        <h1 class="page-title">
          <svg class="title-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M13,3A9,9 0 0,0 4,12H1L4.89,15.89L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3Z"/>
          </svg>
          <span class="title-text">Mi Historial de Estudio</span>
        </h1>
        <p class="page-subtitle">
          Accede a todo tu contenido generado con IA • Organiza • Estudia • Repasa
        </p>
      </div>
      
      <!-- Toolbar -->
      <div class="toolbar">
        <!-- View options -->
        <div class="view-options" role="group" aria-label="Opciones de vista">
          <button id="gridView" class="view-btn active" title="Vista en cuadrícula" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M3,11H11V3H3M3,21H11V13H3M13,21H21V13H13M13,3V11H21V3"/>
            </svg>
            <span class="sr-only">Vista en cuadrícula</span>
          </button>
          <button id="listView" class="view-btn" title="Vista en lista" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M3,5H21V7H3V5M3,13V11H21V13H3M3,19V17H21V19H3Z"/>
            </svg>
            <span class="sr-only">Vista en lista</span>
          </button>
        </div>
        
        <!-- Sort options -->
        <div class="sort-options">
          <label for="sortSelect" class="sr-only">Ordenar por</label>
          <select id="sortSelect" class="sort-select" aria-label="Ordenar contenido">
            <option value="newest">Más reciente</option>
            <option value="oldest">Más antiguo</option>
            <option value="type">Por tipo</option>
            <option value="pdf">Por PDF</option>
          </select>
        </div>
        
        <!-- Bulk actions -->
        <div class="bulk-actions">
          <button id="exportFavorites" class="action-btn" title="Exportar favoritos" style="display: none;">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
            </svg>
            <span>Exportar</span>
          </button>
          <button id="deleteAll" class="action-btn btn-danger" title="Limpiar historial" style="display: none;">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/>
            </svg>
            <span>Limpiar</span>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Search and filters -->
    <div class="search-filter-bar">
      <div class="search-section">
        <div class="search-container">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/>
            </svg>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Buscar por contenido, PDF, fecha..." 
              class="search-input"
              aria-label="Buscar en el historial"
              autocomplete="off"
            >
            <button id="clearSearch" class="clear-search" style="display: none;" title="Limpiar búsqueda">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"/>
              </svg>
              <span class="sr-only">Limpiar búsqueda</span>
            </button>
          </div>
        </div>
      </div>
      
      <!-- Filter tabs -->
      <div class="filter-tabs" role="tablist" aria-label="Filtros de contenido">
        <button id="filterAll" class="filter-tab active" role="tab" aria-selected="true" data-filter="all">
          <span class="filter-icon">📚</span>
          <span class="filter-text">Todos</span>
          <span id="totalItems" class="filter-count">0</span>
        </button>
        <button id="filterFavorites" class="filter-tab" role="tab" aria-selected="false" data-filter="favorites">
          <span class="filter-icon">❤️</span>
          <span class="filter-text">Favoritos</span>
          <span id="totalFavorites" class="filter-count">0</span>
        </button>
        <button id="filterResumenes" class="filter-tab" role="tab" aria-selected="false" data-filter="resumen">
          <span class="filter-icon">📄</span>
          <span class="filter-text">Resúmenes</span>
          <span class="filter-count">0</span>
        </button>
        <button id="filterVF" class="filter-tab" role="tab" aria-selected="false" data-filter="verdadero_falso">
          <span class="filter-icon">✅</span>
          <span class="filter-text">V/F</span>
          <span class="filter-count">0</span>
        </button>
        <button id="filterMultiple" class="filter-tab" role="tab" aria-selected="false" data-filter="multiple_choice">
          <span class="filter-icon">🔘</span>
          <span class="filter-text">Múltiple</span>
          <span class="filter-count">0</span>
        </button>
        <button id="filterMapas" class="filter-tab" role="tab" aria-selected="false" data-filter="mapa_mental">
          <span class="filter-icon">🗺️</span>
          <span class="filter-text">Mapas</span>
          <span class="filter-count">0</span>
        </button>
        <button id="filterFlashcards" class="filter-tab" role="tab" aria-selected="false" data-filter="flashcards">
          <span class="filter-icon">🃏</span>
          <span class="filter-text">Flashcards</span>
          <span class="filter-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Content area -->
  <main class="content-area">
    <!-- Content grid -->
    <div id="contentGrid" class="content-grid" role="main" aria-live="polite" aria-label="Contenido del historial">
      <!-- Content will be loaded here dynamically -->
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state" style="display: none;">
      <div class="empty-state-content">
        <div class="empty-state-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6Z"/>
          </svg>
        </div>
        <h3 class="empty-state-title">No hay contenido disponible</h3>
        <p class="empty-state-message">
          Aún no has generado ningún contenido con IA.<br>
          Sube un PDF y genera resúmenes, preguntas o<br>
          mapas mentales para comenzar.
        </p>
        <button id="startStudying" class="cta-button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"/>
          </svg>
          Comenzar a estudiar
        </button>
      </div>
    </div>

    <!-- Pagination -->
    <div id="pagination" class="pagination" style="display: none;">
      <button id="prevPage" class="pagination-btn" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z"/>
        </svg>
        Anterior
      </button>
      <div class="pagination-info">
        <span id="pageInfo">Página 1 de 1</span>
      </div>
      <button id="nextPage" class="pagination-btn" disabled>
        Siguiente
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"/>
        </svg>
      </button>
    </div>
  </main>
</div>

<!-- Estilos CSS inline para el historial -->

  display: inline-flex;
  align-items: center;

  padding: 20px 0;
}

.pagination-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border: 1px solid #e1e5e9;
  border-radius: 6px;
  background: white;
  cursor: pointer;
  transition: all 0.2s ease;
}

.pagination-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.pagination-btn:not(:disabled):hover {
  background: #f8f9fa;
}

.pagination-btn svg {
  width: 16px;
  height: 16px;
}

.pagination-info {
  font-size: 14px;

}

.loading-indicator {
  position: fixed;
  top: 0;
  left: 0;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.loading-spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #f3f3f3;
  border-top: 4px solid #667eea;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 16px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loading-text {
  font-size: 16px;
  color: #666;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 768px) {
  .historial-container {
    padding: 16px;
  }
  
  .header-content {
    flex-direction: column;
    align-items: stretch;
  }
  
  .toolbar {
    justify-content: space-between;
  }
  
  .content-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  
  .filter-tabs {
    overflow-x: auto;
    padding-bottom: 8px;
  }
  
  .pagination {
    flex-direction: column;
    gap: 16px;
  }
}
</style>
