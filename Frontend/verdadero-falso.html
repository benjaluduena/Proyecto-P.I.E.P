<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdadero o Falso</title>
  <link rel="stylesheet" href="/Css/vf.css">
  <link rel="stylesheet" href="/Css/Clases/botones.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Overlay de Loading -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <p>Cargando preguntas...</p>
    </div>
  </div>

  <main class="vf-container">
    <!-- Header con botones de navegación y acciones -->
    <header class="vf-header">
      <div class="vf-header-left">
        <button class="btn close-btn" id="closeBtn" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.225 4.811a1 1 0 00-1.414 1.414L10.586 12 4.81 17.775a1 1 0 101.414 1.414L12 13.414l5.775 5.775a1 1 0 001.414-1.414L13.414 12l5.775-5.775a1 1 0 00-1.414-1.414L12 10.586 6.225 4.81z"/>
          </svg>
        </button>
        <button class="quiz-title" id="quizTitle" aria-label="Título del Quiz">Quizzes De Dificultad Creciente</button>
      </div>
      <div class="vf-header-right">
        <button class="btn-white" id="printBtn" aria-label="Imprimir">
          <svg width="16" height="16" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17 2C17.5523 2 18 2.44772 18 3V7H21C21.5523 7 22 7.44772 22 8V18C22 18.5523 21.5523 19 21 19H18V21C18 21.5523 17.5523 22 17 22H7C6.44772 22 6 21.5523 6 21V19H3C2.44772 19 2 18.5523 2 18V8C2 7.44772 2.44772 7 3 7H6V3C6 2.44772 6.44772 2 7 2H17ZM16 17H8V20H16V17ZM20 9H4V17H6V16C6 15.4477 6.44772 15 7 15H17C17.5523 15 18 15.4477 18 16V17H20V9ZM8 10V12H5V10H8ZM16 4H8V7H16V4Z"></path></svg>
          Imprimir
        </button>
        <button class="btn btn-primary" id="shareBtn" aria-label="Compartir">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
          </svg>
          Compartir
        </button>
      </div>
    </header>

    <!-- Tarjeta principal de pregunta -->
    <section class="vf-question-card">
      <div class="vf-question-header">
        <h2 class="vf-question-title">
          Cargando pregunta...
        </h2>
        <div class="vf-question-number">-</div>
      </div>
      
      <!-- Opciones Verdadero/Falso -->
      <div class="vf-options">
        <button class="vf-option" data-option="true" data-correct="false">
          <span class="vf-option-text">Verdadero</span>
        </button>
        <button class="vf-option" data-option="false" data-correct="true">
          <span class="vf-option-text">Falso</span>
        </button>
      </div>
      
      <!-- Feedback de respuesta -->
      <div class="vf-feedback" id="vfFeedback" style="display: none;">
        <p class="vf-feedback-text" id="feedbackText"></p>
        <button class="vf-explanation-link" id="explanationLink" style="display: none;">
          Ver explicación 
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
          </svg>
        </button>
      </div>
      
      <!-- Explicación (se muestra cuando se activa) -->
      <div class="vf-explanation" id="vfExplanation">
        <h4>Explicación:</h4>
        <p>Cargando explicación...</p>
      </div>
      
      <!-- Botón de continuar -->
      <div class="vf-continue-container" id="continueContainer" style="display: none;">
        <button class="btn btn-primary vf-continue-btn" id="continueBtn">
          Continuar 
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Navegación inferior -->
    <nav class="vf-navigation">
      <div class="vf-nav-left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="vf-grid-icon">
          <path d="M3 3h7v7H3V3zm0 11h7v7H3v-7zm11-11h7v7h-7V3zm0 11h7v7h-7v-7z"/>
        </svg>
        <div class="vf-progress">
          <span>-</span>
          <div class="vf-progress-bar">
            <div class="vf-progress-fill" style="width: 0%"></div>
          </div>
          <span>-</span>
        </div>
      </div>
      <div class="vf-nav-right">
        <button class="vf-nav-btn" id="prevBtn" aria-label="Anterior">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        </button>
        <button class="vf-nav-btn" id="nextBtn" aria-label="Siguiente">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
          </svg>
        </button>
      </div>
    </nav>
  </main>

  <!-- Scripts -->
  <script src="/JS/simple-auth-check.js"></script>
  <script src="/JS/config.js"></script>
  <script src="/lib/supabase.js"></script>
  <script src="/JS/verdadero-falso.js"></script>
</body>
</html>
