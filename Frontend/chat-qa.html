<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/Assets/Imagenes/PIEP-LOGOS.png">
    <link rel="shortcut icon" type="image/png" href="/Assets/Imagenes/PIEP-LOGOS.png">
    <link rel="apple-touch-icon" href="/Assets/Imagenes/PIEP-LOGOS.png">
    <title>Chat Q&A - P.I.E.P</title>
    <link rel="stylesheet" href="/Css/Index/styles.css">
    <link rel="stylesheet" href="/Css/chat-qa-modern.css">
    <link rel="stylesheet" href="/Css/Clases/clases.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="qa-container-modern">
        <div class="qa-header">
            <div class="qa-header-left">
                <button class="btn-white-icon" onclick="history.back()" aria-label="Cerrar">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M1.99805 21.0001V19.0001L3.99805 18.9999V4.83465C3.99805 4.35136 4.34367 3.93723 4.81916 3.85078L14.2907 2.12868C14.6167 2.0694 14.9291 2.28564 14.9884 2.61167C14.9948 2.64708 14.998 2.68301 14.998 2.719V3.9999L18.998 4.00007C19.5503 4.00007 19.998 4.44779 19.998 5.00007V18.9999L21.998 19.0001V21.0001H17.998V6.00007L14.998 5.9999V21.0001H1.99805ZM12.998 4.3965L5.99805 5.66923V19.0001H12.998V4.3965ZM11.998 11.0001V13.0001H9.99805V11.0001H11.998Z">
                        </path>
                    </svg>
                </button>
                <div class="qa-title-top" id="pdfTitle">
                    Documento
                </div>
            </div>
            <div class="qa-header-right">
                <button class="btn-purple" aria-label="Compartir">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z">
                        </path>
                    </svg>
                    Compartir
                </button>
            </div>
        </div>

        <div class="chat-container">
            <!-- Header
            <header class="qa-header-modern">
                <div class="qa-header-content">

                    <div class="qa-title-section">
                        <h1 class="qa-title">Chat Inteligente</h1>
                        <p class="qa-subtitle">Conversa con tu documento PDF</p>
                    </div>
                    <div class="qa-pdf-info" id="pdfInfo">
                        <div class="qa-pdf-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.89 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z" />
                            </svg>
                        </div>
                        <div class="qa-status-indicator" id="qaStatus">
                            <div class="qa-status-dot"></div>
                            <span>Conectado</span>
                        </div>
                    </div>
                </div>
            </header> -->

            <!-- Messages Container -->
            <div class="qa-messages-container">
                <div class="qa-messages" id="chatMessages">
                    <!-- Welcome Message -->
                    <div class="qa-welcome">
                        <div class="qa-welcome-avatar">
                            <img src="/Assets/Imagenes/Zorro-IA.png" alt="AI Assistant" width="64" height="64">
                        </div>
                        <div class="qa-welcome-content">
                            <h3>¡Hola! Soy tu asistente de estudio</h3>
                            <p>Puedes hacerme cualquier pregunta sobre el contenido de tu PDF. Estoy aquí para ayudarte
                                a entender mejor el material.</p>
                            <div class="qa-suggestions">
                                <button class="qa-suggestion-chip"
                                    data-suggestion="¿Cuál es el tema principal del documento?">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                            d="M20 22H4C3.44772 22 3 21.5523 3 21V3C3 2.44772 3.44772 2 4 2H20C20.5523 2 21 2.44772 21 3V21C21 21.5523 20.5523 22 20 22ZM7 4H5V20H19V4H14V13L10.5 11L7 13V4Z">
                                        </path>
                                    </svg>
                                    ¿Cuál es el tema principal?
                                </button>
                                <button class="qa-suggestion-chip"
                                    data-suggestion="¿Puedes resumir los puntos más importantes?">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                            d="M20 22H4C3.44772 22 3 21.5523 3 21V3C3 2.44772 3.44772 2 4 2H20C20.5523 2 21 2.44772 21 3V21C21 21.5523 20.5523 22 20 22ZM19 20V4H5V20H19ZM8 7H16V9H8V7ZM8 11H16V13H8V11ZM8 15H13V17H8V15Z">
                                        </path>
                                    </svg>
                                    Resumir puntos clave
                                </button>
                                <button class="qa-suggestion-chip"
                                    data-suggestion="¿Qué conceptos son más difíciles de entender?">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                            d="M9.97308 18H11V13H13V18H14.0269C14.1589 16.7984 14.7721 15.8065 15.7676 14.7226C15.8797 14.6006 16.5988 13.8564 16.6841 13.7501C17.5318 12.6931 18 11.385 18 10C18 6.68629 15.3137 4 12 4C8.68629 4 6 6.68629 6 10C6 11.3843 6.46774 12.6917 7.31462 13.7484C7.40004 13.855 8.12081 14.6012 8.23154 14.7218C9.22766 15.8064 9.84103 16.7984 9.97308 18ZM10 20V21H14V20H10ZM5.75395 14.9992C4.65645 13.6297 4 11.8915 4 10C4 5.58172 7.58172 2 12 2C16.4183 2 20 5.58172 20 10C20 11.8925 19.3428 13.6315 18.2443 15.0014C17.624 15.7748 16 17 16 18.5V21C16 22.1046 15.1046 23 14 23H10C8.89543 23 8 22.1046 8 21V18.5C8 17 6.37458 15.7736 5.75395 14.9992Z">
                                        </path>
                                    </svg>
                                    Conceptos complejos
                                </button>
                                <button class="qa-suggestion-chip"
                                    data-suggestion="¿Puedes crear preguntas para practicar?">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                            d="M5.76282 17H20V5H4V18.3851L5.76282 17ZM6.45455 19L2 22.5V4C2 3.44772 2.44772 3 3 3H21C21.5523 3 22 3.44772 22 4V18C22 18.5523 21.5523 19 21 19H6.45455ZM11 14H13V16H11V14ZM8.56731 8.81346C8.88637 7.20919 10.302 6 12 6C13.933 6 15.5 7.567 15.5 9.5C15.5 11.433 13.933 13 12 13H11V11H12C12.8284 11 13.5 10.3284 13.5 9.5C13.5 8.67157 12.8284 8 12 8C11.2723 8 10.6656 8.51823 10.5288 9.20577L8.56731 8.81346Z">
                                        </path>
                                    </svg>
                                    Crear preguntas de práctica
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Typing Indicator -->
                <div class="qa-typing-indicator" id="typingIndicator" style="display: none;">
                    <div class="qa-message-avatar qa-avatar-ai">
                        <img src="/Assets/Imagenes/Zorro-IA.png" alt="AI" width="32" height="32">
                    </div>
                    <div class="qa-typing-content">
                        <div class="qa-typing-text">El asistente está pensando...</div>
                        <div class="qa-typing-animation">
                            <div class="qa-typing-dot"></div>
                            <div class="qa-typing-dot"></div>
                            <div class="qa-typing-dot"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Container -->
            <div class="qa-input-container">
                <div class="qa-input-wrapper">
                    <input type="text" class="qa-input" id="chatInput"
                        placeholder="Escribe tu pregunta sobre el documento..." autocomplete="off" />
                    <button class="qa-send-btn" id="sendButton">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M3.5 1.34558C3.58425 1.34558 3.66714 1.36687 3.74096 1.40747L22.2034 11.5618C22.4454 11.6949 22.5337 11.9989 22.4006 12.2409C22.3549 12.324 22.2865 12.3924 22.2034 12.4381L3.74096 22.5924C3.499 22.7255 3.19497 22.6372 3.06189 22.3953C3.02129 22.3214 3 22.2386 3 22.1543V1.84558C3 1.56944 3.22386 1.34558 3.5 1.34558ZM5 4.38249V10.9999H10V12.9999H5V19.6174L18.8499 11.9999L5 4.38249Z">
                            </path>
                        </svg>
                    </button>
                </div>
                <!-- <div class="qa-input-footer">
                    <div class="qa-input-hint">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                        </svg>
                        Presiona Enter para enviar, Shift + Enter para nueva línea
                    </div>
                    <button id="clearChatBtn" class="qa-back-btn" style="margin-left:auto">Limpiar chat</button>
                </div> -->
            </div>
        </div>
    </div>

    <script src="/lib/supabase.js"></script>
    <script src="/JS/config.js"></script>
    <script src="/JS/chat-qa.js"></script>
</body>

</html>
