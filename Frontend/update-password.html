<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña</title>
  <link rel="stylesheet" href="/Css/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="form-container">
    <img src="/Assets/Imagenes/Logo.png" alt="Logo" class="logo" />
    <h2>Restablecer contraseña</h2>
    <form id="update-password-form">
      <div class="input-group">
        <label for="new_password">Nueva contraseña</label>
        <input type="password" id="new_password" placeholder="********" required />
      </div>
      <div class="input-group">
        <label for="confirm_password">Confirmar contraseña</label>
        <input type="password" id="confirm_password" placeholder="********" required />
      </div>
      <button type="submit" class="submit-button">Guardar nueva contraseña</button>
    </form>
  </div>

  <script src="/lib/supabase.js"></script>
  <script src="/JS/config.js"></script>
  <script src="/JS/update-password.js"></script>
</body>
</html>
